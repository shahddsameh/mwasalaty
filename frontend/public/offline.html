<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mwasalaty Offline</title>
    <meta name="theme-color" content="#fdbb20" />
    <style>
      :root {
        color: #0f172a;
        background: #f8fafc;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        border: 2px solid #dbe4ee;
        border-radius: 16px;
        background: #ffffff;
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.75rem;
      }

      p {
        margin: 0;
        color: #64748b;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        color: #0f172a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Mwasalaty can still open cached pages. Reconnect to refresh routes,
        tickets, and live trip data.
      </p>
      <a href="/">Back to app</a>
    </main>
  </body>
</html>
